<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Something like that..</title>
    <style>
        /* ---------- reset ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #050510;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* ---------- stars ---------- */
        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite alternate;
            box-shadow: 0 0 6px 1px rgba(255, 255, 255, 0.3);
        }

        @keyframes twinkle {
            0% {
                opacity: 0.15;
                transform: scale(0.8);
            }
            100% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        /* ---------- black hole background ---------- */
        .blackhole {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #0a0a20 0%, #000000 100%);
        }

        /* central glow (pulsing) */
        .glow-core {
            position: absolute;
            width: 30vmin;
            height: 30vmin;
            background: radial-gradient(circle, rgba(180, 200, 255, 0.7) 0%, rgba(100, 150, 255, 0.2) 50%, transparent 80%);
            border-radius: 50%;
            filter: blur(20px);
            animation: pulseGlow 3s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% {
                transform: scale(0.8);
                opacity: 0.6;
            }
            100% {
                transform: scale(1.3);
                opacity: 1;
            }
        }

        /* accretion rings */
        .ring {
            position: absolute;
            border-radius: 50%;
            border: 2px solid rgba(200, 220, 255, 0.15);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotateX(70deg) rotateZ(0deg);
            animation: spinRing 25s linear infinite;
            box-shadow: 0 0 60px rgba(150, 200, 255, 0.05);
            will-change: transform;
        }

        .ring:nth-child(2) {
            width: 40vmin;
            height: 40vmin;
            border-color: rgba(200, 230, 255, 0.25);
            animation-duration: 30s;
            border-width: 3px;
            box-shadow: 0 0 80px rgba(150, 200, 255, 0.1);
        }
        .ring:nth-child(3) {
            width: 60vmin;
            height: 60vmin;
            border-color: rgba(180, 210, 255, 0.15);
            animation-duration: 40s;
            animation-direction: reverse;
            border-width: 2px;
        }
        .ring:nth-child(4) {
            width: 85vmin;
            height: 85vmin;
            border-color: rgba(160, 190, 255, 0.08);
            animation-duration: 55s;
            border-width: 1px;
            border-style: dashed;
        }
        .ring:nth-child(5) {
            width: 120vmin;
            height: 120vmin;
            border-color: rgba(140, 170, 255, 0.05);
            animation-duration: 70s;
            animation-direction: reverse;
            border-width: 1px;
        }

        @keyframes spinRing {
            0% {
                transform: translate(-50%, -50%) rotateX(70deg) rotateZ(0deg);
            }
            100% {
                transform: translate(-50%, -50%) rotateX(70deg) rotateZ(360deg);
            }
        }

        /* additional shine streaks (light rays) */
        .rays {
            position: absolute;
            width: 100%;
            height: 100%;
            background: repeating-conic-gradient(from 0deg at 50% 50%,
                    transparent 0deg,
                    rgba(255, 255, 255, 0.02) 2deg,
                    transparent 4deg,
                    transparent 8deg);
            animation: rotateRays 60s linear infinite;
            opacity: 0.5;
            pointer-events: none;
        }

        @keyframes rotateRays {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* ---------- text ---------- */
        .message {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 800px;
            padding: 2rem;
            color: white;
            font-size: clamp(1.8rem, 6vw, 4.2rem);
            font-weight: 300;
            letter-spacing: 0.04em;
            line-height: 1.3;
            text-shadow: 0 0 30px rgba(100, 150, 255, 0.4), 0 0 60px rgba(100, 150, 255, 0.2);
            animation: textPulse 4s ease-in-out infinite alternate;
            font-family: 'Georgia', 'Times New Roman', serif;
            transform: translateY(0);
        }

        .message .sub {
            font-size: 0.7em;
            opacity: 0.7;
        }

        @keyframes textPulse {
            0% {
                text-shadow: 0 0 20px rgba(150, 200, 255, 0.3), 0 0 40px rgba(100, 150, 255, 0.1);
            }
            100% {
                text-shadow: 0 0 40px rgba(200, 230, 255, 0.6), 0 0 80px rgba(150, 200, 255, 0.3);
            }
        }

        /* ---------- language toggle button ---------- */
        .lang-toggle {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 20;
            display: flex;
            gap: 6px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 6px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .lang-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
            font-weight: 500;
            padding: 8px 18px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.03em;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        .lang-btn:hover {
            color: rgba(255, 255, 255, 0.85);
            background: rgba(255, 255, 255, 0.06);
        }

        .lang-btn.active {
            background: rgba(150, 200, 255, 0.18);
            color: #fff;
            box-shadow: 0 0 20px rgba(100, 150, 255, 0.15);
        }

        .lang-btn:focus-visible {
            outline: 2px solid rgba(150, 200, 255, 0.5);
            outline-offset: 2px;
        }

        /* ---------- mobile adjustments ---------- */
        @media (max-width: 600px) {
            .message {
                font-size: 1.8rem;
                padding: 1rem;
                letter-spacing: 0.02em;
            }
            .ring:nth-child(2) {
                width: 50vmin;
                height: 50vmin;
            }
            .ring:nth-child(3) {
                width: 75vmin;
                height: 75vmin;
            }
            .ring:nth-child(4) {
                width: 100vmin;
                height: 100vmin;
            }
            .ring:nth-child(5) {
                width: 140vmin;
                height: 140vmin;
            }
            .glow-core {
                width: 40vmin;
                height: 40vmin;
            }

            .lang-toggle {
                top: 16px;
                right: 16px;
                padding: 4px;
                gap: 4px;
            }
            .lang-btn {
                font-size: 0.7rem;
                padding: 6px 12px;
            }
        }

        @media (max-width: 400px) {
            .lang-toggle {
                top: 12px;
                right: 12px;
                padding: 3px;
                gap: 3px;
            }
            .lang-btn {
                font-size: 0.6rem;
                padding: 4px 10px;
            }
            .message {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>

    <!-- stars (generated by JS) -->
    <div class="stars-container" id="stars"></div>

    <!-- black hole visual -->
    <div class="blackhole">
        <!-- central glow -->
        <div class="glow-core"></div>
        <!-- accretion rings -->
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
        <!-- light rays -->
        <div class="rays"></div>
    </div>

    <!-- language toggle -->
    <div class="lang-toggle" role="group" aria-label="Language toggle">
        <button class="lang-btn active" data-lang="en" aria-pressed="true">EN</button>
        <button class="lang-btn" data-lang="ru" aria-pressed="false">RU</button>
    </div>

    <!-- main message -->
    <div class="message" id="message">
        <span id="line1">If you're trapped in a black hole, don't give up. There is a way out</span><br />
        <span class="sub" id="line2">- Stephen Hawking</span>
    </div>

    <!-- star generation & language logic -->
    <script>
        (function createStars() {
            const container = document.getElementById('stars');
            const count = 200;

            for (let i = 0; i < count; i++) {
                const star = document.createElement('div');
                star.className = 'star';

                const size = 1 + Math.random() * 2;
                star.style.width = size + 'px';
                star.style.height = size + 'px';

                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';

                const duration = 2 + Math.random() * 4;
                const delay = Math.random() * 5;
                star.style.setProperty('--duration', duration + 's');
                star.style.animationDelay = delay + 's';

                container.appendChild(star);
            }
        })();

        // ---------- language data ----------
        const translations = {
            en: {
                line1: "If you're trapped in a black hole, don't give up. There is a way out",
                line2: "- Stephen Hawking",
            },
            ru: {
                line1: 'Если вы попали в чёрную дыру, не сдавайтесь. Выход есть',
                line2: '- Стивен Хокинг',
            }
        };

        // ---------- DOM refs ----------
        const line1El = document.getElementById('line1');
        const line2El = document.getElementById('line2');
        const buttons = document.querySelectorAll('.lang-btn');

        let currentLang = 'en';

        // ---------- update text ----------
        function setLanguage(lang) {
            if (!translations[lang]) return;
            currentLang = lang;
            const t = translations[lang];
            line1El.textContent = t.line1;
            line2El.textContent = t.line2;

            // update button states
            buttons.forEach(btn => {
                const isActive = btn.dataset.lang === lang;
                btn.classList.toggle('active', isActive);
                btn.setAttribute('aria-pressed', isActive ? 'true' : 'false');
            });
        }

        // ---------- event listeners ----------
        buttons.forEach(btn => {
            btn.addEventListener('click', function() {
                const lang = this.dataset.lang;
                if (lang === currentLang) return;
                setLanguage(lang);
            });
        });
    </script>

</body>
</html>
